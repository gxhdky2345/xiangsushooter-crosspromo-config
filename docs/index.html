<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XiangsuShooter Cross Promo Config</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10161f;
      color: #f4f7fb;
      display: grid;
      min-height: 100vh;
      place-items: center;
    }
    main {
      width: min(760px, calc(100vw - 32px));
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 32px;
    }
    a { color: #7ed0ff; }
    code {
      display: block;
      margin-top: 12px;
      padding: 12px;
      background: rgba(0,0,0,0.25);
      border-radius: 10px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>XiangsuShooter Cross Promo Config</h1>
    <p>This repository hosts remote config used by XiangsuShooter / 像素丧尸 builds.</p>
    <p>Cross promo endpoint:</p>
    <code>/cross_promo/config.json</code>
    <p>Ads remote config endpoint:</p>
    <code>/app_config.json</code>
  </main>
</body>
</html>
